# Compose da VPS (compartilhada com outras aplicações).
# - Nomes de container/volume/rede com prefixo "para2026-" para não colidir com nada existente.
# - Porta alta só em 127.0.0.1 (APP_PORT, padrão 47815); acesso público via nginx do host em https://DOMAIN
# - A imagem é SEMPRE construída no GitHub Actions e publicada no GHCR; a VPS só faz pull (sem seção build).
services:
  whatsapp:
    image: ghcr.io/fernandinhomartins40/para2026-whatsapp:${RELEASE:-latest}
    container_name: para2026-whatsapp
    restart: unless-stopped
    ports:
      # Só localhost: o acesso público é pelo nginx do host (https://DOMAIN)
      - "127.0.0.1:${APP_PORT:-47815}:3000"
    environment:
      - PORT=3000
      - HEADLESS=true
      - DATA_DIR=/app/data
      - TZ=America/Sao_Paulo
      - DEFAULT_COUNTRY_CODE=${DEFAULT_COUNTRY_CODE:-55}
      # Cadastro próprio (e-mail e senha). "false" bloqueia novos cadastros.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      # Opcional: login com Google além do cadastro próprio (Client ID público, vem do workflow).
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Multiusuário: um Chromium por usuário conectado (~300-400 MB cada).
      - MAX_BROWSERS=${MAX_BROWSERS:-4}
      - IDLE_MINUTES=${IDLE_MINUTES:-15}
    volumes:
      # Banco SQLite, imagens e sessões do WhatsApp de cada usuário (não perde o login entre deploys)
      - para2026_data:/app/data
    # Chromium precisa de /dev/shm maior que os 64 MB padrão do Docker
    shm_size: "1g"
    mem_limit: 2560m
    # Tempo para fechar os navegadores com calma no deploy (evita perfil travado)
    stop_grace_period: 30s
    networks:
      - para2026

volumes:
  para2026_data:
    name: para2026_data

networks:
  para2026:
    name: para2026
