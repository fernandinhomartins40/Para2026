name: Build and Deploy (GHCR -> VPS)

# A imagem é construída SOMENTE no runner do GitHub e publicada no GHCR.
# A VPS nunca compila: o GitHub entra por SSH (secret VPS_PASSWORD), faz pull e sobe o container.
# Sem domínio: acesso por http://VPS_HOST:APP_PORT

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Um deploy por vez; se chegar commit novo, cancela o anterior.
concurrency:
  group: deploy-para2026
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fernandinhomartins40/para2026-whatsapp
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  # Porta alta no host para não colidir com as outras aplicações da VPS.
  APP_PORT: "47815"
  SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # `latest` + SHA do commit (permite rollback pelo redeploy.yml)
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false
          sbom: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Enviar compose e script para a VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "mkdir -p /opt/para2026/scripts"
          sshpass -e scp $SSH_OPTS docker-compose.vps.yml "${VPS_USER}@${VPS_HOST}:/opt/para2026/"
          sshpass -e scp $SSH_OPTS scripts/vps-deploy.sh "${VPS_USER}@${VPS_HOST}:/opt/para2026/scripts/"

      - name: Deploy na VPS (pull only, sem build)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ github.sha }}
        run: |
          # O token do GHCR vai pelo stdin, não pela linha de comando
          echo "$GHCR_TOKEN" | sshpass -e ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" \
            "RELEASE='${RELEASE}' APP_PORT='${APP_PORT}' GHCR_USER='${{ github.actor }}' bash /opt/para2026/scripts/vps-deploy.sh"
          echo "Aplicação: http://${VPS_HOST}:${APP_PORT}"
