name: Redeploy / Rollback (pull only)

# Sobe na VPS uma imagem JÁ CONSTRUÍDA no GitHub (GHCR), sem novo build.
#   - release = latest -> recria o container com a versão atual
#   - release = SHA completo de um commit -> rollback para aquela versão
# Usa apenas o secret VPS_PASSWORD (SSH).

"on":
  workflow_dispatch:
    inputs:
      release:
        description: "Tag da imagem: 'latest' ou o SHA completo de um commit já publicado"
        required: true
        default: latest

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-para2026
  cancel-in-progress: false

env:
  VPS_HOST: 72.60.10.108
  VPS_USER: root
  APP_PORT: "47815"
  # Client ID OAuth do Google (termina em .apps.googleusercontent.com). É público, não é secret.
  GOOGLE_CLIENT_ID: ""
  # Subdomínio (DNS A -> VPS). O deploy configura o nginx do host e o certificado HTTPS.
  DOMAIN: zap.fuselink.com.br
  SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          echo "$RELEASE" | grep -Eq '^(latest|[0-9a-f]{40})$' \
            || { echo "release deve ser 'latest' ou um SHA completo (40 caracteres)"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Enviar compose e script para a VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "mkdir -p /opt/para2026/scripts"
          sshpass -e scp $SSH_OPTS docker-compose.vps.yml "${VPS_USER}@${VPS_HOST}:/opt/para2026/"
          sshpass -e scp $SSH_OPTS scripts/vps-deploy.sh "${VPS_USER}@${VPS_HOST}:/opt/para2026/scripts/"

      - name: Redeploy na VPS (pull only, sem build)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ inputs.release }}
        run: |
          # O token do GHCR vai pelo stdin, não pela linha de comando
          echo "$GHCR_TOKEN" | sshpass -e ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" \
            "RELEASE='${RELEASE}' APP_PORT='${APP_PORT}' GOOGLE_CLIENT_ID='${GOOGLE_CLIENT_ID}' DOMAIN='${DOMAIN}' GHCR_USER='${{ github.actor }}' bash /opt/para2026/scripts/vps-deploy.sh"
          echo "Aplicação: https://${DOMAIN}"
